<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Uganda coffee crop</title>
  <desc id="desc">Close-up coffee cherries on branch with green leaves and soft hillside background.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fb35c"/>
      <stop offset="100%" stop-color="#5f8f49"/>
    </linearGradient>
    <filter id="blurLarge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f5d2a"/>
      <stop offset="100%" stop-color="#2f7a36"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e3a1d"/>
      <stop offset="100%" stop-color="#7e4e29"/>
    </linearGradient>
    <radialGradient id="berryRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8a8a"/>
      <stop offset="100%" stop-color="#b90f17"/>
    </radialGradient>
    <radialGradient id="berryGreen" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d5f486"/>
      <stop offset="100%" stop-color="#67a32c"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.55" filter="url(#blurLarge)">
    <ellipse cx="1250" cy="130" rx="380" ry="170" fill="#9bd06f"/>
    <ellipse cx="1050" cy="260" rx="450" ry="190" fill="#6ba24a"/>
    <ellipse cx="1380" cy="380" rx="380" ry="170" fill="#7fbe58"/>
  </g>

  <g>
    <path d="M0 900 C180 690, 360 600, 620 560 C870 520, 1100 550, 1600 700 L1600 900 Z" fill="#2f7a36" opacity="0.8"/>
    <path d="M0 900 C190 760, 430 700, 720 670 C960 646, 1210 680, 1600 780 L1600 900 Z" fill="#24662d" opacity="0.9"/>
  </g>

  <g>
    <ellipse cx="150" cy="690" rx="220" ry="110" fill="url(#leaf)" transform="rotate(-18 150 690)"/>
    <ellipse cx="240" cy="770" rx="260" ry="120" fill="url(#leaf)" transform="rotate(-8 240 770)"/>
    <ellipse cx="360" cy="650" rx="220" ry="100" fill="url(#leaf)" transform="rotate(12 360 650)"/>
  </g>

  <g transform="rotate(10 780 400)">
    <rect x="120" y="340" width="1340" height="22" rx="10" fill="url(#branch)"/>

    <g fill="url(#berryRed)">
      <circle cx="180" cy="328" r="24"/><circle cx="220" cy="370" r="24"/><circle cx="260" cy="334" r="24"/>
      <circle cx="320" cy="365" r="24"/><circle cx="360" cy="330" r="24"/><circle cx="400" cy="368" r="24"/>
      <circle cx="500" cy="330" r="24"/><circle cx="540" cy="366" r="24"/><circle cx="580" cy="332" r="24"/>
      <circle cx="680" cy="370" r="24"/><circle cx="720" cy="334" r="24"/><circle cx="760" cy="368" r="24"/>
      <circle cx="870" cy="332" r="24"/><circle cx="910" cy="370" r="24"/><circle cx="950" cy="334" r="24"/>
      <circle cx="1060" cy="368" r="24"/><circle cx="1100" cy="332" r="24"/><circle cx="1140" cy="370" r="24"/>
      <circle cx="1240" cy="334" r="24"/><circle cx="1280" cy="368" r="24"/><circle cx="1320" cy="332" r="24"/>
    </g>

    <g fill="url(#berryGreen)">
      <circle cx="1370" cy="370" r="22"/><circle cx="1410" cy="336" r="22"/><circle cx="1450" cy="370" r="22"/>
    </g>
  </g>

  <g opacity="0.2" fill="#ffffff">
    <circle cx="190" cy="324" r="5"/><circle cx="368" cy="326" r="5"/><circle cx="548" cy="362" r="5"/>
    <circle cx="724" cy="330" r="5"/><circle cx="914" cy="366" r="5"/><circle cx="1110" cy="328" r="5"/>
    <circle cx="1288" cy="364" r="5"/><circle cx="1420" cy="332" r="4"/>
  </g>
</svg>
