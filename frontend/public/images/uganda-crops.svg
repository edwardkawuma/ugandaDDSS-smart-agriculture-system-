<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Uganda crops landscape</title>
  <desc id="desc">Illustrated fields of maize, banana, and cassava with hills and sunrise.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd3ff"/>
      <stop offset="65%" stop-color="#d6eeff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd56a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd56a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#75a86d"/>
      <stop offset="100%" stop-color="#5f8f5c"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f9c63"/>
      <stop offset="100%" stop-color="#557f4e"/>
    </linearGradient>
    <linearGradient id="fieldA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fc05c"/>
      <stop offset="100%" stop-color="#6c9942"/>
    </linearGradient>
    <linearGradient id="fieldB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7a35f"/>
      <stop offset="100%" stop-color="#a27d3a"/>
    </linearGradient>
    <linearGradient id="fieldC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7eb66a"/>
      <stop offset="100%" stop-color="#5f9d4f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <circle cx="1220" cy="180" r="70" fill="#ffd56a"/>
  <ellipse cx="1220" cy="220" rx="220" ry="130" fill="url(#sunGlow)"/>

  <path d="M0,480 C240,380 420,400 620,470 C820,540 990,520 1180,450 C1360,390 1500,390 1600,430 L1600,900 L0,900 Z" fill="url(#hillA)"/>
  <path d="M0,560 C230,470 460,500 670,560 C890,620 1080,610 1280,550 C1450,500 1540,510 1600,540 L1600,900 L0,900 Z" fill="url(#hillB)"/>

  <path d="M0,640 L460,580 L760,900 L0,900 Z" fill="url(#fieldA)"/>
  <path d="M360,600 L900,540 L1220,900 L640,900 Z" fill="url(#fieldB)"/>
  <path d="M860,560 L1600,500 L1600,900 L1080,900 Z" fill="url(#fieldC)"/>

  <g opacity="0.55" stroke="#ffffff" stroke-width="2">
    <path d="M70,680 L420,620"/>
    <path d="M160,730 L520,655"/>
    <path d="M260,785 L610,705"/>
    <path d="M470,650 L860,585"/>
    <path d="M560,705 L960,635"/>
    <path d="M650,760 L1050,690"/>
    <path d="M960,625 L1410,555"/>
    <path d="M1040,685 L1490,615"/>
    <path d="M1120,745 L1560,675"/>
  </g>

  <g fill="#2f6c36">
    <path d="M250,600 c30,-90 90,-120 130,-80 c-35,5 -67,35 -80,80 z"/>
    <path d="M280,600 c20,-95 -20,-150 -70,-155 c22,26 30,65 20,108 z"/>
    <path d="M320,600 c24,-94 -8,-138 -53,-158 c18,24 24,63 13,106 z"/>

    <path d="M620,560 c30,-90 90,-120 130,-80 c-35,5 -67,35 -80,80 z"/>
    <path d="M650,560 c20,-95 -20,-150 -70,-155 c22,26 30,65 20,108 z"/>
    <path d="M690,560 c24,-94 -8,-138 -53,-158 c18,24 24,63 13,106 z"/>

    <path d="M1010,545 c30,-90 90,-120 130,-80 c-35,5 -67,35 -80,80 z"/>
    <path d="M1040,545 c20,-95 -20,-150 -70,-155 c22,26 30,65 20,108 z"/>
    <path d="M1080,545 c24,-94 -8,-138 -53,-158 c18,24 24,63 13,106 z"/>
  </g>

  <g stroke="#2e5e2d" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="760" x2="120" y2="690"/>
    <line x1="170" y1="750" x2="170" y2="680"/>
    <line x1="220" y1="740" x2="220" y2="670"/>
    <line x1="270" y1="730" x2="270" y2="660"/>
    <line x1="320" y1="720" x2="320" y2="650"/>

    <line x1="790" y1="770" x2="790" y2="700"/>
    <line x1="840" y1="760" x2="840" y2="690"/>
    <line x1="890" y1="750" x2="890" y2="680"/>
    <line x1="940" y1="740" x2="940" y2="670"/>
    <line x1="990" y1="730" x2="990" y2="660"/>

    <line x1="1300" y1="760" x2="1300" y2="700"/>
    <line x1="1360" y1="750" x2="1360" y2="690"/>
    <line x1="1420" y1="740" x2="1420" y2="680"/>
    <line x1="1480" y1="730" x2="1480" y2="670"/>
  </g>

  <text x="70" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#1f4423" opacity="0.9">
    Uganda Crop Fields
  </text>
</svg>
